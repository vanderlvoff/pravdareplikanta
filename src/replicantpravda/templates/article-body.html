{% for block in article.body %}
{% if block.type == 'list' %}<ul>{% for item in block['items'] %}<li>{{ item }}</li>{% endfor %}</ul>
{% elif block.type == 'heading' %}<h3>{{ block.text }}</h3>
{% elif block.type == 'quote' %}<blockquote>{{ block.text }}</blockquote>
{% else %}<p>{{ block.text }}</p>{% endif %}
{% endfor %}
