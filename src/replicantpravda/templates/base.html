<!doctype html>
<html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex,nofollow"><title>{{ edition.title }}</title><link rel="stylesheet" href="/style.css"></head>
<body><aside>{{ labels.notice }}</aside><header><nav aria-label="Languages">{% for code in ['ru','en','ja'] %}<a lang="{{ code }}" hreflang="{{ code }}" href="/{{ code }}/{% if translations is defined %}articles/{{ translations[code] }}/{% endif %}">{{ code|upper }}</a> {% endfor %}</nav><h1><a href="/{{ lang }}/">{{ edition.title }}</a></h1><p><time datetime="{{ issue.publication_date }}">{{ issue.publication_date }}</time> · № {{ issue.number }} · rev. {{ issue.revision }} · {{ issue.status }}</p><a href="/{{ lang }}/archive/">{{ labels.archive }}</a></header><main>{% block content %}{% endblock %}</main></body></html>
