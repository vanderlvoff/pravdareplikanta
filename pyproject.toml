[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "replicantpravda"
version = "0.1.0"
description = "Local-first multilingual newspaper generator"
requires-python = ">=3.12"
dependencies = ["Jinja2==3.1.6", "pydantic==2.12.3"]

[project.optional-dependencies]
artwork = ["Pillow==12.0.0"]
visual = ["playwright==1.56.0"]
pdf = ["playwright==1.56.0", "PyMuPDF==1.26.5"]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[project.scripts]
rp = "replicantpravda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
replicantpravda = ["templates/*", "prompts/*.txt"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
